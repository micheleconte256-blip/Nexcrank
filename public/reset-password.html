<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Reimposta password · Nexcrank</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080e19; color: #edf4ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #142a40 0, #080e19 55%); }
    main { width: min(100%, 460px); padding: 32px; border: 1px solid #26364d; border-radius: 24px; background: #0d1726; box-shadow: 0 24px 80px #0006; }
    .brand { display: inline-block; margin: 0 0 24px; color: #edf4ff; font-weight: 850; font-size: 23px; letter-spacing: .06em; text-decoration: none; }
    .brand span { color: #20c7dc; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 6vw, 32px); }
    .intro { margin: 0 0 24px; color: #9aabc0; line-height: 1.55; }
    label { display: block; margin: 16px 0 7px; color: #dce6f4; font-size: 14px; font-weight: 650; }
    input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #304057; border-radius: 10px; outline: none; background: #09111e; color: white; font: inherit; font-size: 16px; }
    input:focus { border-color: #20c7dc; box-shadow: 0 0 0 3px #20c7dc22; }
    .help { margin: 8px 0 0; color: #8394aa; font-size: 12px; line-height: 1.45; }
    button { width: 100%; min-height: 50px; margin-top: 22px; border: 0; border-radius: 11px; background: #20c7dc; color: #05111a; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .message { min-height: 22px; margin: 14px 0 0; color: #fda4af; font-size: 14px; line-height: 1.45; }
    .message.success { color: #73e0b0; }
    .back { display: inline-block; margin-top: 22px; color: #9aabc0; font-size: 14px; text-decoration: none; }
    .back:hover { color: white; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { body { padding: 16px; } main { padding: 24px 20px; border-radius: 20px; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="index.html">NEX<span>CRANK</span></a>
    <h1>Reimposta la password</h1>
    <p class="intro" id="intro">Verifico il link di reimpostazione…</p>
    <form id="resetForm" hidden>
      <label for="email">Account</label>
      <input id="email" type="email" autocomplete="username" readonly>
      <label for="password">Nuova password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
      <p class="help">Usa almeno 10 caratteri.</p>
      <label for="confirmPassword">Conferma la nuova password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
      <button id="submitButton" type="submit">Salva la nuova password</button>
    </form>
    <p class="message" id="message" role="status" aria-live="polite"></p>
    <a class="back" id="backLink" href="accesso.html">← Torna all’accesso</a>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, verifyPasswordResetCode, confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBe7hvL9-ku94HlgjLyGhLLh8JVJl5vtkw",
      authDomain: "nexcrank-5118d.firebaseapp.com",
      projectId: "nexcrank-5118d",
      appId: "1:508780036969:web:9bc61c20c18029197cf3f8"
    };
    const auth = getAuth(initializeApp(firebaseConfig));
    auth.languageCode = "it";

    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");
    const resetForm = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("submitButton");
    const intro = document.getElementById("intro");
    const message = document.getElementById("message");
    const backLink = document.getElementById("backLink");
    let verifiedEmail = "";

    // Firebase aggiunge i parametri continueUrl ai link di azione; accettiamo
    // solo la pagina di accesso sul dominio atteso.
    const continueUrl = params.get("continueUrl");
    if (continueUrl) {
      try {
        const candidate = new URL(continueUrl);
        if (candidate.origin === "https://nexcrank.onrender.com" && candidate.pathname.endsWith("/accesso.html")) {
          backLink.href = candidate.href;
        }
      } catch { /* Link non valido: resta il collegamento locale predefinito. */ }
    }

    function showError(error) {
      const messages = {
        "auth/expired-action-code": "Questo link è scaduto. Richiedi una nuova email di reimpostazione.",
        "auth/invalid-action-code": "Questo link non è valido o è già stato usato. Richiedine uno nuovo.",
        "auth/weak-password": "La password è troppo debole. Scegline una più lunga e sicura.",
        "auth/operation-not-allowed": "La reimpostazione password non è abilitata per questo progetto Firebase.",
        "auth/network-request-failed": "Connessione non riuscita. Controlla la rete e riprova."
      };
      message.textContent = messages[error?.code] || "Non è stato possibile completare la reimpostazione. Richiedi un nuovo link e riprova.";
      intro.textContent = "Il link non può essere usato.";
    }

    async function initializeReset() {
      if (mode !== "resetPassword" || !oobCode) {
        intro.textContent = "Il link è incompleto o non è un link di reimpostazione password.";
        message.textContent = "Richiedi una nuova email dalla schermata di accesso.";
        return;
      }
      try {
        verifiedEmail = await verifyPasswordResetCode(auth, oobCode);
        emailInput.value = verifiedEmail;
        intro.textContent = "Scegli una nuova password per il tuo account.";
        resetForm.hidden = false;
        passwordInput.focus();
      } catch (error) {
        showError(error);
      }
    }

    resetForm.addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("success");
      message.textContent = "";
      if (passwordInput.value !== confirmInput.value) {
        message.textContent = "Le due password non coincidono.";
        confirmInput.focus();
        return;
      }
      submitButton.disabled = true;
      submitButton.textContent = "Salvataggio…";
      try {
        await confirmPasswordReset(auth, oobCode, passwordInput.value);
        resetForm.hidden = true;
        intro.textContent = "La password è stata aggiornata.";
        message.classList.add("success");
        message.textContent = "Ora puoi accedere con la nuova password.";
        passwordInput.value = "";
        confirmInput.value = "";
        backLink.textContent = "Vai alla schermata di accesso →";
      } catch (error) {
        showError(error);
        submitButton.disabled = false;
        submitButton.textContent = "Salva la nuova password";
      }
    });

    initializeReset();
  </script>
</body>
</html>
