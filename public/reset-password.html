<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="referrer" content="no-referrer">
  <title>Reimposta password · Nexcrank</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080e19; color: #edf4ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 0%, #142a40 0, #080e19 55%); }
    .card { width: min(100%, 460px); padding: 32px; border: 1px solid #26364d; border-radius: 24px; background: #0d1726; box-shadow: 0 24px 80px #0006; }
    .brand { display: inline-block; margin-bottom: 24px; color: #edf4ff; font-size: 23px; font-weight: 850; letter-spacing: .06em; text-decoration: none; }
    .brand span { color: #20c7dc; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 6vw, 32px); }
    .intro { margin: 0 0 24px; color: #9aabc0; line-height: 1.55; }
    label { display: block; margin: 16px 0 7px; color: #dce6f4; font-size: 14px; font-weight: 650; }
    .password-field { position: relative; }
    input { width: 100%; min-height: 48px; padding: 12px 54px 12px 14px; border: 1px solid #304057; border-radius: 10px; outline: none; background: #09111e; color: white; font: inherit; font-size: 16px; }
    input:focus { border-color: #20c7dc; box-shadow: 0 0 0 3px #20c7dc22; }
    .password-visibility { position: absolute; top: 50%; right: 7px; width: 38px; height: 38px; display: grid; place-items: center; transform: translateY(-50%); border: 0; border-radius: 8px; background: transparent; color: #9aabc0; cursor: pointer; }
    .password-visibility:hover, .password-visibility:focus-visible { background: #1a2a3d; color: #20c7dc; outline: none; }
    .password-visibility svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .password-visibility .eye-slash { display: none; }
    .password-visibility[aria-pressed="true"] .eye-slash { display: block; }
    .help { margin: 8px 0 0; color: #8394aa; font-size: 12px; }
    .submit { width: 100%; min-height: 50px; margin-top: 22px; border: 0; border-radius: 11px; background: #20c7dc; color: #05111a; font: inherit; font-weight: 800; cursor: pointer; }
    .submit:disabled { opacity: .65; cursor: wait; }
    .message { min-height: 22px; margin: 14px 0 0; color: #fda4af; font-size: 14px; line-height: 1.45; }
    .message.success { color: #73e0b0; }
    .back { display: inline-block; margin-top: 22px; color: #9aabc0; font-size: 14px; text-decoration: none; }
    .back:hover { color: white; }
    @media (max-width: 480px) { body { padding: 16px; } .card { padding: 24px 20px; border-radius: 20px; } }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="index.html">NEX<span>CRANK</span></a>
    <h1>Nuova password</h1>
    <p class="intro">Scegli una password nuova per il tuo account.</p>
    <form id="resetForm">
      <label for="password">Nuova password</label>
      <div class="password-field">
        <input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <button class="password-visibility" type="button" data-target="password" aria-label="Mostra password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 4 16 16"/></svg></button>
      </div>
      <p class="help">Usa almeno 10 caratteri.</p>
      <label for="confirmPassword">Conferma nuova password</label>
      <div class="password-field">
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <button class="password-visibility" type="button" data-target="confirmPassword" aria-label="Mostra password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 4 16 16"/></svg></button>
      </div>
      <button id="submitButton" class="submit" type="submit">Salva nuova password</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="accesso.html">← Torna all’accesso</a>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get("token") || "";
    const form = document.getElementById("resetForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    document.querySelectorAll(".password-visibility").forEach(toggle => toggle.addEventListener("click", () => {
      const field = document.getElementById(toggle.dataset.target);
      const show = field.type === "password";
      field.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label", show ? "Nascondi password" : "Mostra password");
    }));
    if (!token) {
      button.disabled = true;
      message.textContent = "Link mancante. Torna all’accesso e richiedi un nuovo link.";
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("success");
      if (password.value !== confirmPassword.value) {
        message.textContent = "Le due password non coincidono.";
        confirmPassword.focus();
        return;
      }
      button.disabled = true;
      button.textContent = "Salvataggio…";
      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: password.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.errore || "Non riesco a reimpostare la password.");
        message.classList.add("success");
        message.textContent = "Password aggiornata. Ti porto alla pagina di accesso…";
        setTimeout(() => window.location.assign("accesso.html"), 1400);
      } catch (error) {
        message.textContent = error.message || "Connessione non riuscita. Riprova.";
        button.disabled = false;
        button.textContent = "Salva nuova password";
      }
    });
  </script>
  <footer style="padding:18px;text-align:center;color:#8292a8;font:13px system-ui"><a href="privacy.html" style="color:#20c7dc;margin:0 10px">Privacy</a><a href="termini.html" style="color:#20c7dc;margin:0 10px">Termini di servizio</a></footer>
</body>
</html>
